name: Build Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build and Package for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update app version
        shell: pwsh
        # Utilizando a abordagem direta e limpa do seu exemplo
        run: |
          powershell -Command "(Get-Content pubspec.yaml) -replace '^version: .*', 'version: 1.0.${{ github.run_number }}' | Set-Content pubspec.yaml"

      - name: Run code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        run: flutter build windows --release

      - name: Generate Inno Setup script
        run: dart run inno_bundle:build --no-app --release --no-installer[cite: 4]

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2[cite: 4]
        with:
          # Caminho estático correto baseado na saída padrão do inno_bundle
          path: ./build/windows/x64/installer/Release/inno-script.iss[cite: 4]

      - name: Prepare Windows Artifacts
        shell: pwsh
        run: |
          # Utiliza curinga (*.exe) para capturar o instalador independentemente do nome padrão do inno_bundle
          # e padroniza o nome do arquivo na raiz do repositório
          Move-Item -Path "build\windows\x64\installer\Release\*.exe" -Destination "simulador_nasa-v1.0.${{ github.run_number }}-windows-x86_64.exe"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulador-nasa-windows
          path: simulador_nasa-v1.0.${{ github.run_number }}-windows-x86_64.exe
          if-no-files-found: error